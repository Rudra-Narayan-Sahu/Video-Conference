services:
  # Edge Load Balancer & Reverse Proxy
  loadbalancer:
    image: nginx:alpine
    container_name: aurameet-loadbalancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - backend-1
      - backend-2
      - frontend
    networks:
      - aurameet-network

  # Backend Node #1 (Load-Balanced Express + Socket.IO)
  backend-1:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: aurameet-backend-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/video-conference
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_production_jwt_key_video_2026_change_in_env
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aurameet-network

  # Backend Node #2 (Load-Balanced Express + Socket.IO)
  backend-2:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: aurameet-backend-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/video-conference
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_production_jwt_key_video_2026_change_in_env
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aurameet-network

  # Redis for Socket.IO Cross-Instance Pub/Sub & Cluster Sync
  redis:
    image: redis:7-alpine
    container_name: aurameet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - aurameet-network

  # MongoDB Persistence Store
  mongodb:
    image: mongo:7.0
    container_name: aurameet-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aurameet-network

  # Frontend Web UI (Nginx-Served Single Page Application)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: aurameet-frontend
    restart: unless-stopped
    networks:
      - aurameet-network

networks:
  aurameet-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  nginx-logs:
